workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

docs-build:
  stage: test
  image: python:3.11-bookworm
  tags:
    - small-linux
  script:
    - python -m pip install -r docs/requirements.txt
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week

docs-14-build:
  stage: test
  image: python:3.11-bookworm
  tags:
    - small-linux
  needs:
    - job: docs-build
      artifacts: true
  script:
    - python -m pip install -r docs/requirements.txt
    - mkdocs build --strict -f mkdocs-1.4.yml -d site-1.4
    - python tools/check_preview_links.py site-1.4 site
  artifacts:
    paths:
      - site-1.4/
    expire_in: 1 week

docs-14-search:
  stage: test
  image: node:22-bookworm-slim
  tags:
    - small-linux
  needs:
    - job: docs-14-build
      artifacts: true
  script:
    - node tools/check_preview_search.cjs site-1.4

private-docs-pages:
  stage: deploy
  image: alpine:3.20
  tags:
    - small-linux
  needs:
    - job: docs-build
      artifacts: true
  script:
    - test -f site/index.html
  pages:
    publish: site
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
