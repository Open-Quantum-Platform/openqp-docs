spec:
  inputs:
    release_ref:
      description: Internal engine release branch whose manual must be present
      default: ""
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

docs-build:
  stage: test
  image: python:3.11-bookworm
  tags:
    - small-linux
  script:
    - python -m pip install -r docs/requirements.txt
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week

docs-14-build:
  stage: test
  image: python:3.11-bookworm
  tags:
    - small-linux
  needs:
    - job: docs-build
      artifacts: true
  script:
    - python -m pip install -r docs/requirements.txt
    - python tools/build_versioned_manual.py 1.4 site-1.4 --site-url "${CI_PAGES_URL%/}/manual/1.4/"
    - python tools/check_preview_links.py site-1.4 site "${CI_PAGES_URL%/}/manual/1.4/"
  artifacts:
    paths:
      - site-1.4/
    expire_in: 1 week

docs-14-search:
  stage: test
  image: node:22-bookworm-slim
  tags:
    - small-linux
  needs:
    - job: docs-14-build
      artifacts: true
    - job: docs-build
      artifacts: true
  script:
    - node tools/check_preview_search.cjs site-1.4 site

private-manual-assembly:
  stage: test
  variables:
    OQP_MANUAL_RELEASE_REF: $[[ inputs.release_ref ]]
  image: python:3.11-bookworm
  tags:
    - small-linux
  needs:
    - job: docs-build
      artifacts: true
    - job: docs-14-search
      artifacts: false
  script:
    - python -m pip install -r docs/requirements.txt
    - python tools/build_private_manual.py
  artifacts:
    paths:
      - site/
    expire_in: 1 week

private-docs-pages:
  stage: deploy
  image: alpine:3.20
  tags:
    - small-linux
  resource_group: private-manual-pages
  needs:
    - job: private-manual-assembly
      artifacts: true
  script:
    - test -f site/index.html
    - test -f site/manual/index.html
    - printf 'Private manual index %s/manual/\n' "${CI_PAGES_URL%/}"
  pages:
    publish: site
  rules:
    - if: '$CI_PROJECT_ID == "34" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
